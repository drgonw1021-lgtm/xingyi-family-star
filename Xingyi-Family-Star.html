function doJoin(code){
  return apiCall({ action: 'join', code: String(code || '').toUpperCase().trim() }).then(function(r){
    if(!r.ok) throw new Error(r.err || 'fail');
    S.gid = r.gid; S.code = r.code; S.token = r.token; S.rev = r.rev || 0;
    S.syncedAt = Date.now();

}

  if(!syncOn()) return Promise.resolve(null);
  return apiCall({ action: 'pull', gid: S.gid, token: S.token }).then(function(r){
    if(!r.ok) throw new Error(r.err || 'fail');
    S.rev = r.rev || S.rev;

  });
}

    if(!r.ok) throw new Error(r.err || 'fail');

}

/* ---------- 离线分享码：不依赖服务器，也能把星图交给家人 ---------- */
function packShare(){
  const g = { v:1, t:Date.now(), fams:S.fams||[], people:S.people||[], unions:S.unions||[], pc:S.pc||[] };
  const json = JSON.stringify(g);
  let b64 = '';
  try{ b64 = btoa(unescape(encodeURIComponent(json))); }
  catch(e){ b64 = ''; }
  return 'XY1-' + b64;
}
function unpackShare(str){
  const s = String(str||'').trim().replace(/^XY1-/, '').replace(/\s+/g, '');
  if(!s) throw new Error('no_code');
  let json = '';
  try{ json = decodeURIComponent(escape(atob(s))); }
  catch(e){ throw new Error('bad_code'); }
  let g = null;
  try{ g = JSON.parse(json); }
  catch(e){ throw new Error('bad_code'); }
  return g;
}
function mergeShare(g){
  if(!g || !g.people) throw new Error('bad_code');
  let added = 0;
  const pid = {};
  (S.people || []).forEach(function(p){ if(p && p.id) pid[p.id] = 1; });
  (g.people || []).forEach(function(p){
    if(p && p.id && !pid[p.id]){ S.people.push(p); pid[p.id] = 1; added++; }
  });
  const seen = {};
  function keyOf(o){ try{ return JSON.stringify(o); }catch(e){ return ''; } }
  (S.unions || []).forEach(function(u){ seen['u' + keyOf(u)] = 1; });
  (g.unions || []).forEach(function(u){
    const k = 'u' + keyOf(u);
    if(!seen[k]){ S.unions.push(u); seen[k] = 1; }
  });
  (S.fams || []).forEach(function(f){ seen['f' + keyOf(f)] = 1; });
  (g.fams || []).forEach(function(f){
    const k = 'f' + keyOf(f);
    if(!seen[k]){ S.fams.push(f); seen[k] = 1; }
  });
  (S.pc || []).forEach(function(c){ seen['c' + keyOf(c)] = 1; });
  (g.pc || []).forEach(function(c){
    const k = 'c' + keyOf(c);
    if(!seen[k]){ S.pc.push(c); seen[k] = 1; }
  });
  return added;
}
function copyToClipboard(txt){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt); return true; }
    const ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}

/* ---------- 连线：悬停或点一下就告诉你这两颗是什么关系 ---------- */
const edgeTipEl = document.getElementById('edgeTip');
let edgeHover = null;

function segDist(px, py, ax, ay, bx, by){
  const dx = bx - ax, dy = by - ay;
  const L = dx * dx + dy * dy;
  let t = L ? ((px - ax) * dx + (py - ay) * dy) / L : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
}

function hitEdge(x, y){
  const pj = {};
  nodes.forEach(n => { if(visible(n)) pj[n.id] = project(n.x, n.y, zOf(n)); });
  let best = null, bestD = 9;
  edges.forEach(e => {
    const a = pj[e.from], b = pj[e.to];
    if(!a || !b) return;
    const mid = e.hub ? pj['h_' + e.hub.union.id] : null;
    if(mid){
      const d0 = Math.min(
        segDist(x, y, a.x, a.y, mid.x, mid.y),
        segDist(x, y, mid.x, mid.y, b.x, b.y)
      );
      if(d0 < bestD){ bestD = d0; best = e; }
    } else {
      const d0 = segDist(x, y, a.x, a.y, b.x, b.y);
      if(d0 < bestD){ bestD = d0; best = e; }
    }
  });
  return best;
}

function showEdgeTip(e, cx, cy){
  const vp = P(viewerId || S.me);
  const other = e.p2 ? P(e.p2) : null;
  let sub = '';
  if(vp && other && other.id !== vp.id && other.id !== e.p1){
    const t = kinTermL(vp.id, other.id);
    if(t && t !== '未连接'){
      sub = LANG === 'en'
        ? (vp.name + ' sees ' + other.name + ' as ' + t)
        : (vp.name + ' 眼里，' + other.name + ' 是' + t);
    }
  }
  edgeTipEl.innerHTML = '<b>' + esc(e.txt || '') + '</b>' + (sub ? '<span>' + esc(sub) + '</span>' : '');
  edgeTipEl.style.left = Math.max(8, Math.min(window.innerWidth - 252, cx + 16)) + 'px';
  edgeTipEl.style.top = Math.max(8, Math.min(window.innerHeight - 92, cy + 16)) + 'px';
  edgeTipEl.classList.add('on');
}
function hideEdgeTip(){ edgeTipEl.classList.remove('on'); }

const ptrs = new Map();
let down = false, moved = 0, lx = 0, ly = 0, pinch = null;
const rectOf = () => cv.getBoundingClientRect();

cv.addEventListener('pointerdown', e => {
  hideEdgeTip();
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if(ptrs.size === 1){ down = true; moved = 0; lx = e.clientX; ly = e.clientY; }
  if(ptrs.size === 2){
    const a = Array.from(ptrs.values());
    pinch = {
      d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y),
      dist: cam.dist,
      cx: (a[0].x + a[1].x) / 2,
      cy: (a[0].y + a[1].y) / 2
    };
    down = false;
  }
});

cv.addEventListener('pointermove', e => {
  if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if(ptrs.size === 2 && pinch){
    const a = Array.from(ptrs.values());
    const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
    cam.dist = Math.max(300, Math.min(5600, pinch.dist * (pinch.d / Math.max(1, d))));
    return;
  }

  if(down){
    const dx = e.clientX - lx, dy = e.clientY - ly;
    moved += Math.hypot(dx, dy);
    spinHold = 9;
    cam.yaw += dx * 0.0026;
    cam.pitch = Math.max(-0.5, Math.min(1.0, cam.pitch + dy * 0.0022));
    lx = e.clientX; ly = e.clientY;
    if(moved > 6) cv.classList.add('dragging');
    return;
  }

  const r = rectOf();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const h = hit(x, y);
  hovered = h;
  edgeHover = h ? null : hitEdge(x, y);
  if(edgeHover){
    showEdgeTip(edgeHover, e.clientX, e.clientY);
    cv.style.cursor = 'pointer';
  } else {
    hideEdgeTip();
    cv.style.cursor = h ? 'pointer' : 'grab';
  }
});

function endPointer(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size < 2) pinch = null;
  if(ptrs.size === 0) cv.classList.remove('dragging');
  if(down && moved < 7){
    const r = rectOf();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const h = hit(x, y);
    if(h){ showCard(h); hideEdgeTip(); }
    else {
      const ee = hitEdge(x, y);
      if(ee) showEdgeTip(ee, e.clientX, e.clientY);
      else { hideEdgeTip(); hideCard(); }
    }
  }
  down = false;
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); down = false; pinch = null; });

function zoomAt(px, py, factor){
  cam.dist = Math.max(300, Math.min(5600, cam.dist / Math.max(0.2, factor)));
}

cv.addEventListener('wheel', e => {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 0.89);
}, { passive: false });

cv.addEventListener('dblclick', e => {
  e.preventDefault();
  if(fitBox) fitView();
  toast('已回到全景');
});
